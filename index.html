<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDON HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            cursor: auto !important; /* คืนค่าเคอร์เซอร์ปกติ */
        }

        body {
            background-color: #080808;
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
        }

        .header h1 span { color: #ff003c; }

        .btn-admin-access {
            background: #1a1a1a;
            border: 1px solid #ff003c;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer !important;
            font-weight: 600;
        }

        /* Navbar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 9999;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer !important;
            padding: 10px;
        }

        .nav-btn.active {
            color: #ff003c;
        }

        /* Admin Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #121212;
            border: 1px solid #ff003c;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .input-box {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 10px;
            background: #ff003c;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer !important;
        }

        /* Category Tabs */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .cat-btn {
            background: #121212;
            border: 1px solid #333;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer !important;
            white-space: nowrap;
        }

        .cat-btn.active {
            border-color: #ff003c;
            color: #ff003c;
            background: rgba(255, 0, 60, 0.1);
        }

        /* Cards */
        .addon-card {
            background: #121212;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .addon-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .btn-dl {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 8px;
            background: #1a1a1a;
            color: #ff003c;
            border: 1px solid #ff003c;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
        }

        .visitor-counter {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #121212;
            border-radius: 8px;
            border: 1px solid #222;
            font-size: 12px;
            color: #aaa;
        }

        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="container">
        <div class="header">
            <h1>ADDON<span>HUB</span></h1>
            <button class="btn-admin-access" onclick="openAdminModal()">
                <i class="fa-solid fa-lock"></i> Admin
            </button>
        </div>

        <!-- Section: Home -->
        <div id="secHome" class="section active">
            <!-- Admin Panel -->
            <div id="adminPanel" style="display:none; background:#121212; border:1px solid #ff003c; padding:15px; border-radius:10px; margin-bottom:20px;">
                <h4 style="color:#ff003c; margin-bottom:10px;">เมนูแอดมิน</h4>
                <input type="text" id="addTitle" class="input-box" placeholder="ชื่อแอดออน">
                <input type="text" id="addLink" class="input-box" placeholder="ลิงก์ดาวน์โหลด">
                <button class="btn-submit" onclick="addNewAddon()">เพิ่มแอดออน</button>
                <button onclick="logoutAdmin()" style="margin-top:10px; background:none; border:none; color:#888; width:100%; cursor:pointer;">ออกจากระบบแอดมิน</button>
            </div>

            <div class="categories">
                <button class="cat-btn active">ALL</button>
                <button class="cat-btn">ADD-ONS</button>
                <button class="cat-btn">WORLD</button>
                <button class="cat-btn">SKINS</button>
            </div>

            <div id="addonContainer">
                <div class="addon-card">
                    <div class="addon-title">ตัวอย่างแอดออนทดสอบ</div>
                    <a href="#" class="btn-dl">DOWNLOAD</a>
                </div>
            </div>
        </div>

        <!-- Section: Search -->
        <div id="secSearch" class="section">
            <input type="text" class="input-box" placeholder="ค้นหาแอดออน...">
        </div>

        <!-- Section: Settings -->
        <div id="secSettings" class="section">
            <p>ตั้งค่าเว็บไซต์</p>
        </div>

        <!-- Visitor Counter -->
        <div class="visitor-counter">
            <i class="fa-solid fa-eye"></i> จำนวนผู้เข้าชมเว็บไซต์ทั้งหมด: <span style="color: #ff003c; font-weight: bold;">102</span> คน
        </div>
    </div>

    <!-- Bottom Navbar -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('secHome', this)"><i class="fa-solid fa-gamepad"></i></button>
        <button class="nav-btn" onclick="switchTab('secSearch', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-btn" onclick="switchTab('secSettings', this)"><i class="fa-solid fa-gear"></i></button>
    </div>

    <!-- Admin Password Modal -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h3>ใส่รหัสผ่านแอดมิน</h3>
            <input type="password" id="adminPass" class="input-box" placeholder="รหัสผ่าน...">
            <button class="btn-submit" onclick="checkAdminPass()">ยืนยัน</button>
            <button onclick="closeAdminModal()" style="margin-top:10px; background:none; border:none; color:#888; cursor:pointer;">ยกเลิก</button>
        </div>
    </div>

<script>
    function switchTab(sectionId, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(sectionId).classList.add('active');
        btn.classList.add('active');
    }

    function openAdminModal() {
        document.getElementById('adminModal').style.display = 'flex';
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
    }

    function checkAdminPass() {
        const pass = document.getElementById('adminPass').value;
        if (pass === 'elite.1190') {
            document.getElementById('adminPanel').style.display = 'block';
            closeAdminModal();
            alert('เข้าสู่ระบบแอดมินสำเร็จ!');
        } else {
            alert('รหัสผ่านไม่ถูกต้อง');
        }
    }

    function logoutAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
    }

    function addNewAddon() {
        const title = document.getElementById('addTitle').value;
        const link = document.getElementById('addLink').value;

        if (!title || !link) {
            alert('กรุณากรอกข้อมูลให้ครบ');
            return;
        }

        const container = document.getElementById('addonContainer');
        const card = document.createElement('div');
        card.className = 'addon-card';
        card.innerHTML = `
            <div class="addon-title">${title}</div>
            <a href="${link}" target="_blank" class="btn-dl">DOWNLOAD</a>
        `;
        container.prepend(card);

        document.getElementById('addTitle').value = '';
        document.getElementById('addLink').value = '';
    }
</script>
</body>
    </html>
