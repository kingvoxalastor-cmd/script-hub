<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINECRAFT ADDON HUB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #050507;
            color: #f3f4f6;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 720px;
            position: relative;
        }

        /* Header Neon Style */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid #a855f7;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.25);
        }

        .header h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .header span {
            color: #22c55e;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        /* ปุ่ม Admin ซ่อนลุคโมเดิร์น */
        .admin-lock-btn {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #a855f7;
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .admin-lock-btn:hover {
            background: #a855f7;
            color: #fff;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.8);
        }

        /* โซน Admin (ฟอร์มลงแอดออน) */
        .admin-card {
            display: none;
            background: #0d0d12;
            border: 1px solid #a855f7;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
            backdrop-filter: blur(10px);
        }

        .admin-card.active {
            display: block;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #22c55e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d1d5db;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            background: #14141d;
            border: 1px solid #27273a;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.7);
        }

        .btn-submit:disabled {
            background: #374151;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* โซนการ์ดแอดออน */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #f3f4f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .addon-card {
            background: #0d0d12;
            border: 1px solid #1f1f2e;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
            position: relative;
        }

        .addon-card:hover {
            border-color: #22c55e;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.25);
        }

        .addon-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background: #14141d;
            display: block;
            border-bottom: 1px solid #1f1f2e;
        }

        .addon-content {
            padding: 20px;
        }

        .addon-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.6);
            color: #fff;
        }

        .empty-text {
            text-align: center;
            color: #6b7280;
            padding: 40px;
            font-size: 16px;
            background: #0d0d12;
            border-radius: 16px;
            border: 1px dashed #27273a;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MINECRAFT <span>ADDON</span></h1>
        <button class="admin-lock-btn" onclick="loginAdmin()" title="Admin Login">🔒 ADMIN</button>
    </div>

    <!-- ฟอร์มเพิ่มแอดออน (Admin) -->
    <div class="admin-card" id="adminForm">
        <div class="card-title">
            <span>⚡ UPLOAD ADDON (ADMIN MODE)</span>
            <button class="logout-btn" onclick="logoutAdmin()">EXIT</button>
        </div>
        <div class="form-group">
            <label>ชื่อแอดออน</label>
            <input type="text" id="addonTitle" placeholder="เช่น: Furniture Addon v2.0" required>
        </div>
        <div class="form-group">
            <label>เลือกรูปภาพตัวอย่าง (ไฟล์รูปภาพ)</label>
            <input type="file" id="addonImage" accept="image/*" required>
        </div>
        <div class="form-group">
            <label>เลือกไฟล์แอดออน (.mcaddon / .mcpack / .zip)</label>
            <input type="file" id="addonFile" required>
        </div>
        <button class="btn-submit" id="submitBtn" onclick="uploadAddon()">PUBLISH ADDON</button>
    </div>

    <!-- รายการแอดออน -->
    <div class="section-title">
        <span>📦</span> แอดออนทั้งหมด
    </div>
    <div class="addon-grid" id="addonList">
        <div class="empty-text">กำลังโหลดแอดออน...</div>
    </div>
</div>

<script>
    const BIN_ID = '6ac4fd7eac6210605a193eb2';
    const MASTER_KEY = '$2a$10$c050I32SC1yvzC7XK5SW1e-q3X3bW7I';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let addonsData = [];

    window.onload = function() {
        fetchAddons();
    };

    function loginAdmin() {
        const password = prompt("กรุณาใส่รหัสผ่านผู้ดูแลระบบ:");
        if (password === "black.1234") {
            alert("ยินดีต้อนรับ! ปลดล็อคระบบลงแอดออนแล้ว");
            document.getElementById('adminForm').classList.add('active');
        } else if (password !== null) {
            alert("รหัสผ่านไม่ถูกต้อง!");
        }
    }

    function logoutAdmin() {
        document.getElementById('adminForm').classList.remove('active');
    }

    function fetchAddons() {
        fetch(API_URL, {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        })
        .then(res => res.json())
        .then(data => {
            addonsData = Array.isArray(data) ? data : [];
            renderAddons();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('addonList').innerHTML = '<div class="empty-text">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
        });
    }

    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function uploadAddon() {
        const title = document.getElementById('addonTitle').value.trim();
        const imgInput = document.getElementById('addonImage');
        const fileInput = document.getElementById('addonFile');
        const submitBtn = document.getElementById('submitBtn');

        if (!title || !imgInput.files[0] || !fileInput.files[0]) {
            alert("กรุณากรอกชื่อแอดออน, เลือกรูปภาพ และเลือกไฟล์แอดออนให้ครบถ้วน!");
            return;
        }

        if (imgInput.files[0].size > 2 * 1024 * 1024) {
            alert("ไฟล์รูปภาพมีขนาดใหญ่เกินไป (กรุณาใช้รูปไม่เกิน 2MB)");
            return;
        }

        if (fileInput.files[0].size > 3 * 1024 * 1024) {
            alert("ไฟล์แอดออนมีขนาดใหญ่เกินไป (ระบบรองรับไฟล์ขนาดไม่เกิน 3MB)");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "UPLOADING...";

        try {
            const imgBase64 = await fileToBase64(imgInput.files[0]);
            const fileBase64 = await fileToBase64(fileInput.files[0]);

            const newAddon = {
                id: Date.now(),
                title: title,
                image: imgBase64,
                fileData: fileBase64,
                fileName: fileInput.files[0].name
            };

            addonsData.unshift(newAddon);

            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(addonsData)
            });

            if (res.ok) {
                alert("โพสต์แอดออนเรียบร้อยแล้ว!");
                document.getElementById('addonTitle').value = '';
                document.getElementById('addonImage').value = '';
                document.getElementById('addonFile').value = '';
                renderAddons();
            } else {
                throw new Error("บันทึกไม่สำเร็จ");
            }
        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการอัปโหลดไฟล์ (ไฟล์อาจมีขนาดใหญ่เกินไป)");
            addonsData.shift();
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "PUBLISH ADDON";
        }
    }

    function renderAddons() {
        const list = document.getElementById('addonList');
        list.innerHTML = '';

        if (addonsData.length === 0) {
            list.innerHTML = '<div class="empty-text">ยังไม่มีแอดออนในระบบ</div>';
            return;
        }

        addonsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'addon-card';

            card.innerHTML = `
                <img src="${item.image}" class="addon-img" alt="${escapeHtml(item.title)}">
                <div class="addon-content">
                    <div class="addon-title">${escapeHtml(item.title)}</div>
                    <a href="${item.fileData}" download="${item.fileName || 'addon.mcaddon'}" class="btn-download">
                        ⚡ DOWNLOAD ADDON
                    </a>
                </div>
            `;

            list.appendChild(card);
        });
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
