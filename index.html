<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDON HUB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a1a;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .header h1 span {
            color: #ff003c;
        }

        .admin-lock-btn {
            background: #141414;
            border: 1px solid #ff003c;
            color: #ff003c;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .admin-lock-btn:hover {
            background: #ff003c;
            color: #fff;
        }

        /* Admin Form Card */
        .admin-card {
            display: none;
            background: #121212;
            border: 1px solid #ff003c;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(255, 0, 60, 0.15);
        }

        .admin-card.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            color: #ff003c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 12px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        input:focus {
            border-color: #ff003c;
        }

        .btn-group-submit {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit {
            flex: 2;
            padding: 10px;
            background: #ff003c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #d60032;
        }

        .btn-submit:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .btn-cancel-edit {
            flex: 1;
            padding: 10px;
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        /* Addon List */
        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .addon-card {
            background: #121212;
            border: 1px solid #1f1f1f;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .addon-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #1a1a1a;
            display: block;
        }

        .addon-content {
            padding: 14px;
        }

        .addon-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            color: #ff003c;
            border: 1px solid #ff003c;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            border-radius: 6px;
            transition: 0.2s;
        }

        .btn-download:hover {
            background: #ff003c;
            color: #ffffff;
        }

        .empty-text {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 13px;
            background: #121212;
            border-radius: 8px;
            border: 1px dashed #222;
        }

        .logout-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .logout-btn:hover {
            color: #fff;
            border-color: #666;
        }

        /* Admin Action Control On Card */
        .admin-controls {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            gap: 6px;
            z-index: 5;
        }

        .admin-mode .admin-controls {
            display: flex;
        }

        .edit-btn {
            background: rgba(255, 170, 0, 0.9);
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }

        .delete-btn {
            background: rgba(255, 0, 60, 0.9);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }

        /* Pagination Control */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #1a1a1a;
        }

        .page-btn {
            background: #141414;
            color: #ff003c;
            border: 1px solid #222;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .page-btn:hover:not(:disabled) {
            border-color: #ff003c;
            background: #ff003c;
            color: #fff;
        }

        .page-btn:disabled {
            color: #444;
            border-color: #1a1a1a;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 12px;
            color: #888;
            font-weight: 600;
        }

        /* Password Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #121212;
            border: 1px solid #ff003c;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 320px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .btn-cancel, .btn-confirm {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-cancel { background: #222; color: #aaa; }
        .btn-confirm { background: #ff003c; color: #fff; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="header">
        <h1>ADDON<span>HUB</span></h1>
        <button class="admin-lock-btn" onclick="openModal()">ADMIN</button>
    </div>

    <!-- ฟอร์มลง/แก้ไข แอดออน (Admin) -->
    <div class="admin-card" id="adminForm">
        <div class="card-title">
            <span id="formHeaderTitle">ADD NEW ADDON</span>
            <button class="logout-btn" onclick="logoutAdmin()">LOGOUT</button>
        </div>
        <div class="form-group">
            <label>ชื่อแอดออน</label>
            <input type="text" id="addonTitle" placeholder="เช่น: Déesse UI v1.3.95" required>
        </div>
        <div class="form-group">
            <label>ลิงก์รูปภาพตัวอย่าง (URL)</label>
            <input type="url" id="addonImage" placeholder="วางลิงก์รูปภาพ..." required>
        </div>
        <div class="form-group">
            <label>ลิงก์ดาวน์โหลดแอดออน (MediaFire / Google Drive / Discord)</label>
            <input type="url" id="addonFile" placeholder="วางลิงก์ไฟล์..." required>
        </div>
        
        <div class="btn-group-submit">
            <button class="btn-submit" id="submitBtn" onclick="handleSubmit()">POST ADDON</button>
            <button class="btn-cancel-edit" id="cancelEditBtn" onclick="resetForm()">CANCEL EDIT</button>
        </div>
    </div>

    <!-- รายการแอดออน -->
    <div class="addon-grid" id="addonList">
        <div class="empty-text">กำลังโหลดแอดออนจากเซิร์ฟเวอร์...</div>
    </div>

    <!-- ปุ่มเปลี่ยนหน้า -->
    <div class="pagination" id="paginationControls" style="display: none;">
        <button class="page-btn" id="prevBtn" onclick="changePage(-1)">&lt; PREV</button>
        <span class="page-info" id="pageInfo">Page 1 of 1</span>
        <button class="page-btn" id="nextBtn" onclick="changePage(1)">NEXT &gt;</button>
    </div>
</div>

<!-- Modal รหัสผ่าน -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
        <div class="modal-title">ADMIN ACCESS</div>
        <div class="modal-subtitle">กรอกรหัสผ่านเพื่อเข้าสู่ระบบผู้ดูแล</div>
        <input type="password" class="modal-input" id="passInput" placeholder="Password..." onkeyup="handleKey(event)">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
            <button class="btn-confirm" onclick="checkPassword()">ยืนยัน</button>
        </div>
    </div>
</div>

<script>
    const BIN_ID = '6ac65023ffd5d1605356252f';
    const MASTER_KEY = '$2a$10$ecvjzzTvc7XkSLw9/7L2gukhIW/w4H.PRNViTUYJoDHgaMRT1Qo.q';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let addonsData = [];
    let currentPage = 1;
    const itemsPerPage = 5;
    let editingAddonId = null;

    window.onload = function() {
        loadAddons();
    };

    function openModal() {
        document.getElementById('passwordModal').classList.add('active');
        document.getElementById('passInput').focus();
    }

    function closeModal() {
        document.getElementById('passwordModal').classList.remove('active');
        document.getElementById('passInput').value = '';
    }

    function handleKey(e) {
        if (e.key === 'Enter') checkPassword();
    }

    function checkPassword() {
        const pass = document.getElementById('passInput').value;
        if (pass === "black.1234") {
            closeModal();
            document.getElementById('adminForm').classList.add('active');
            document.getElementById('mainContainer').classList.add('admin-mode');
        } else {
            alert("รหัสผ่านไม่ถูกต้อง!");
            document.getElementById('passInput').value = '';
        }
    }

    function logoutAdmin() {
        document.getElementById('adminForm').classList.remove('active');
        document.getElementById('mainContainer').classList.remove('admin-mode');
        resetForm();
    }

    function loadAddons() {
        fetch(API_URL + '/latest', {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        })
        .then(res => res.json())
        .then(data => {
            // รองรับทั้งแบบ array ตรงๆ และแบบมีโครงสร้าง { status, data }
            if (Array.isArray(data)) {
                addonsData = data;
            } else if (data && Array.isArray(data.data)) {
                addonsData = data.data;
            } else {
                addonsData = [];
            }
            renderAddons();
        })
        .catch(err => {
            console.error("Error loading addons:", err);
            document.getElementById('addonList').innerHTML = '<div class="empty-text">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้</div>';
        });
    }

    function handleSubmit() {
        if (editingAddonId !== null) {
            updateAddon();
        } else {
            uploadAddon();
        }
    }

    async function uploadAddon() {
        const title = document.getElementById('addonTitle').value.trim();
        const imgUrl = document.getElementById('addonImage').value.trim();
        const fileUrl = document.getElementById('addonFile').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!title || !imgUrl || !fileUrl) {
            alert("กรุณากรอกข้อมูลให้ครบทุกช่อง!");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "UPLOADING...";

        const newAddon = {
            id: Date.now(),
            title: title,
            image: imgUrl,
            downloadUrl: fileUrl
        };

        const updatedList = [newAddon, ...addonsData];

        if (await syncToCloud(updatedList)) {
            addonsData = updatedList;
            currentPage = 1;
            renderAddons();
            resetForm();
            alert("โพสต์แอดออนสำเร็จ! แฟนและคนอื่นเปิดเว็บมาจะเห็นแล้วครับ");
        }

        submitBtn.disabled = false;
        submitBtn.innerText = "POST ADDON";
    }

    function startEdit(id) {
        const target = addonsData.find(item => item.id === id);
        if (!target) return;

        editingAddonId = id;
        document.getElementById('addonTitle').value = target.title;
        document.getElementById('addonImage').value = target.image;
        document.getElementById('addonFile').value = target.downloadUrl;

        document.getElementById('formHeaderTitle').innerText = "EDIT ADDON";
        document.getElementById('submitBtn').innerText = "UPDATE ADDON";
        document.getElementById('cancelEditBtn').style.display = "block";

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function updateAddon() {
        const title = document.getElementById('addonTitle').value.trim();
        const imgUrl = document.getElementById('addonImage').value.trim();
        const fileUrl = document.getElementById('addonFile').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!title || !imgUrl || !fileUrl) {
            alert("กรุณากรอกข้อมูลให้ครบทุกช่อง!");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "UPDATING...";

        const updatedList = addonsData.map(item => {
            if (item.id === editingAddonId) {
                return { ...item, title: title, image: imgUrl, downloadUrl: fileUrl };
            }
            return item;
        });

        if (await syncToCloud(updatedList)) {
            addonsData = updatedList;
            renderAddons();
            resetForm();
            alert("อัปเดตข้อมูลแอดออนเรียบร้อยแล้ว!");
        }

        submitBtn.disabled = false;
    }

    function resetForm() {
        editingAddonId = null;
        document.getElementById('addonTitle').value = '';
        document.getElementById('addonImage').value = '';
        document.getElementById('addonFile').value = '';

        document.getElementById('formHeaderTitle').innerText = "ADD NEW ADDON";
        document.getElementById('submitBtn').innerText = "POST ADDON";
        document.getElementById('cancelEditBtn').style.display = "none";
    }

    async function deleteAddon(id) {
        if (confirm("ต้องการลบแอดออนนี้ใช่หรือไม่?")) {
            const filteredList = addonsData.filter(item => item.id !== id);

            if (await syncToCloud(filteredList)) {
                addonsData = filteredList;
                renderAddons();
                alert("ลบแอดออนเรียบร้อยแล้ว");
            }
        }
    }

    async function syncToCloud(dataList) {
        try {
            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(dataList)
            });

            if (res.ok) {
                return true;
            } else {
                alert("เกิดข้อผิดพลาดในการบันทึกข้อมูลไปยัง Cloud");
                return false;
            }
        } catch (err) {
            alert("ไม่สามารถเชื่อมต่อกับ Cloud ได้");
            return false;
        }
    }

    function changePage(step) {
        currentPage += step;
        renderAddons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderAddons() {
        const list = document.getElementById('addonList');
        const paginationControls = document.getElementById('paginationControls');
        list.innerHTML = '';

        if (addonsData.length === 0) {
            list.innerHTML = '<div class="empty-text">ยังไม่มีแอดออนในขณะนี้</div>';
            paginationControls.style.display = 'none';
            return;
        }

        const totalPages = Math.ceil(addonsData.length / itemsPerPage);
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const currentItems = addonsData.slice(startIndex, endIndex);

        currentItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'addon-card';

            card.innerHTML = `
                <div class="admin-controls">
                    <button class="edit-btn" onclick="startEdit(${item.id})">EDIT</button>
                    <button class="delete-btn" onclick="deleteAddon(${item.id})">DELETE</button>
                </div>
                <img src="${escapeHtml(item.image)}" class="addon-img" alt="preview" onerror="this.src='https://via.
