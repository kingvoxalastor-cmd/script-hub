<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINECRAFT ADDONS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        /* Minimal Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
        }

        .header h1 span {
            color: #ff003c;
        }

        .admin-lock-btn {
            background: #121212;
            border: 1px solid #ff003c;
            color: #ff003c;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 6px;
            transition: 0.2s ease;
        }

        .admin-lock-btn:hover {
            background: #ff003c;
            color: #fff;
        }

        /* Custom Modal Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal-box {
            background: #111111;
            border: 1px solid #ff003c;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 30px rgba(255, 0, 60, 0.2);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        .modal-input:focus {
            border-color: #ff003c;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-cancel {
            flex: 1;
            padding: 10px;
            background: #1e1e1e;
            border: none;
            border-radius: 6px;
            color: #aaa;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-confirm {
            flex: 1;
            padding: 10px;
            background: #ff003c;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        /* Admin Zone Form */
        .admin-card {
            display: none;
            background: #111111;
            border: 1px solid #222;
            border-left: 4px solid #ff003c;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .admin-card.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #ff003c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 10px 12px;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        input[type="text"]:focus, input[type="url"]:focus {
            border-color: #ff003c;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ff003c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: 0.2s ease;
        }

        .btn-submit:hover {
            background: #d60032;
        }

        .btn-submit:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        /* Addon Cards */
        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .addon-card {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            overflow: hidden;
            transition: 0.2s ease;
        }

        .addon-card:hover {
            border-color: #333;
        }

        .addon-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background: #181818;
            display: block;
        }

        .addon-content {
            padding: 16px;
        }

        .addon-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 14px;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 12px;
            background: #181818;
            color: #ff003c;
            border: 1px solid #ff003c;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            border-radius: 6px;
            transition: 0.2s ease;
        }

        .btn-download:hover {
            background: #ff003c;
            color: #ffffff;
        }

        .empty-text {
            text-align: center;
            color: #555;
            padding: 30px;
            font-size: 14px;
            background: #111;
            border-radius: 8px;
            border: 1px dashed #222;
        }

        .logout-btn {
            background: transparent;
            color: #888;
            border: 1px solid #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
        }

        .logout-btn:hover {
            color: #fff;
            border-color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ADDON<span>HUB</span></h1>
        <button class="admin-lock-btn" onclick="openModal()">ADMIN</button>
    </div>

    <!-- ฟอร์มลงแอดออน (Admin) -->
    <div class="admin-card" id="adminForm">
        <div class="card-title">
            <span>UPLOAD ADDON</span>
            <button class="logout-btn" onclick="logoutAdmin()">LOGOUT</button>
        </div>
        <div class="form-group">
            <label>ชื่อแอดออน</label>
            <input type="text" id="addonTitle" placeholder="เช่น: Déesse UI v1.3.95" required>
        </div>
        <div class="form-group">
            <label>ลิงก์รูปภาพตัวอย่าง (วาง URL รูปภาพ)</label>
            <input type="url" id="addonImage" placeholder="https://..." required>
        </div>
        <div class="form-group">
            <label>ลิงก์ดาวน์โหลดแอดออน (MediaFire / Google Drive / Discord)</label>
            <input type="url" id="addonFile" placeholder="https://www.mediafire.com/file/..." required>
        </div>
        <button class="btn-submit" id="submitBtn" onclick="uploadAddon()">POST ADDON</button>
    </div>

    <!-- รายการแอดออน -->
    <div class="addon-grid" id="addonList">
        <div class="empty-text">กำลังโหลดรายการแอดออน...</div>
    </div>
</div>

<!-- Modal Popup ใส่รหัสผ่าน -->
<div class="modal-overlay" id="passwordModal">
    <div class="modal-box">
        <div class="modal-title">ACCESS CONTROL</div>
        <div class="modal-subtitle">กรุณากรอกรหัสผ่านเพื่อเข้าสู่โหมดผู้ดูแลระบบ</div>
        <input type="password" class="modal-input" id="passInput" placeholder="Enter Password..." onkeyup="handleKey(event)">
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
            <button class="btn-confirm" onclick="checkPassword()">ยืนยัน</button>
        </div>
    </div>
</div>

<script>
    const BIN_ID = '6ac4fd7eac6210605a193eb2';
    const MASTER_KEY = '$2a$10$c050I32SC1yvzC7XK5SW1e-q3X3bW7I';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let addonsData = [];

    window.onload = function() {
        fetchAddons();
    };

    function openModal() {
        document.getElementById('passwordModal').classList.add('active');
        document.getElementById('passInput').focus();
    }

    function closeModal() {
        document.getElementById('passwordModal').classList.remove('active');
        document.getElementById('passInput').value = '';
    }

    function handleKey(e) {
        if (e.key === 'Enter') checkPassword();
    }

    function checkPassword() {
        const pass = document.getElementById('passInput').value;
        if (pass === "black.1234") {
            closeModal();
            document.getElementById('adminForm').classList.add('active');
        } else {
            alert("รหัสผ่านไม่ถูกต้อง!");
            document.getElementById('passInput').value = '';
        }
    }

    function logoutAdmin() {
        document.getElementById('adminForm').classList.remove('active');
    }

    function fetchAddons() {
        fetch(API_URL, {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        })
        .then(res => res.json())
        .then(data => {
            addonsData = Array.isArray(data) ? data : [];
            renderAddons();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('addonList').innerHTML = '<div class="empty-text">ไม่สามารถดึงข้อมูลได้</div>';
        });
    }

    async function uploadAddon() {
        const title = document.getElementById('addonTitle').value.trim();
        const imgUrl = document.getElementById('addonImage').value.trim();
        const fileUrl = document.getElementById('addonFile').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!title || !imgUrl || !fileUrl) {
            alert("กรุณากรอกข้อมูลให้ครบทุกช่อง!");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "UPLOADING...";

        try {
            const newAddon = {
                id: Date.now(),
                title: title,
                image: imgUrl,
                downloadUrl: fileUrl
            };

            addonsData.unshift(newAddon);

            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(addonsData)
            });

            if (res.ok) {
                alert("โพสต์แอดออนเรียบร้อยแล้ว!");
                document.getElementById('addonTitle').value = '';
                document.getElementById('addonImage').value = '';
                document.getElementById('addonFile').value = '';
                renderAddons();
            } else {
                throw new Error("บันทึกไม่สำเร็จ");
            }
        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการโพสต์ข้อมูล");
            addonsData.shift();
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "POST ADDON";
        }
    }

    function renderAddons() {
        const list = document.getElementById('addonList');
        list.innerHTML = '';

        if (addonsData.length === 0) {
            list.innerHTML = '<div class="empty-text">ยังไม่มีแอดออนในขณะนี้</div>';
            return;
        }

        addonsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'addon-card';

            card.innerHTML = `
                <img src="${escapeHtml(item.image)}" class="addon-img" alt="${escapeHtml(item.title)}" onerror="this.src='https://via.placeholder.com/600x300/181818/ffffff?text=No+Image'">
                <div class="addon-content">
                    <div class="addon-title">${escapeHtml(item.title)}</div>
                    <a href="${escapeHtml(item.downloadUrl)}" target="_blank" class="btn-download">
                        DOWNLOAD FILE
                    </a>
                </div>
            `;

            list.appendChild(card);
        });
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
