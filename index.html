<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDON HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            padding-bottom: 70px;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        @media (min-width: 768px) {
            body { padding-bottom: 0; padding-left: 80px; }
            .navbar {
                top: 0; left: 0; width: 80px; height: 100vh;
                flex-direction: column; justify-content: flex-start; gap: 30px;
                padding-top: 30px; border-top: none; border-right: 1px solid #222;
            }
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: #ff003c;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 14px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
        }

        .header h1 span { color: #ff003c; }

        /* Secret Admin Trigger Button */
        .secret-admin-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #555;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .secret-admin-btn:hover {
            color: #ff003c;
            border-color: #ff003c;
        }

        /* Admin Secret Password Modal */
        .admin-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 300;
            padding: 20px;
        }

        .admin-modal-card {
            background: #121212;
            border: 1px solid #ff003c;
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.3);
            text-align: center;
        }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: #121212;
            border: 1px solid #222;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-input:focus { border-color: #ff003c; }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        /* Categories Bar */
        .categories-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: #121212;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            border-color: #ff003c;
            color: #ff003c;
            background: rgba(255, 0, 60, 0.1);
        }

        /* Forms & Inputs */
        .form-group { margin-bottom: 12px; text-align: left; }

        label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #ff003c;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Addon List & Cards */
        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .addon-card {
            background: #121212;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .addon-img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #181818;
            position: relative;
        }

        .addon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .like-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            backdrop-filter: blur(4px);
        }

        .like-btn.liked { color: #ff003c; }

        .addon-content { padding: 14px; }

        .addon-category-tag {
            font-size: 10px;
            color: #ff003c;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .addon-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .btn-download {
            display: block;
            text-align: center;
            padding: 10px;
            background: #181818;
            color: #ff003c;
            border: 1px solid #ff003c;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 12px;
        }

        .admin-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }

        .admin-btn {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }

        .edit-btn { background: #ffaa00; color: #000; }
        .delete-btn { background: #ff003c; color: #fff; }

        .visitor-counter {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: #121212;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
            font-size: 12px;
            color: #666;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchPage('home', this)"><i class="fa-solid fa-gamepad"></i></button>
        <button class="nav-btn" onclick="switchPage('search', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-btn" onclick="switchPage('favorites', this)"><i class="fa-solid fa-heart"></i></button>
        <button class="nav-btn" onclick="switchPage('settings', this)"><i class="fa-solid fa-gear"></i></button>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ADDON<span>HUB</span></h1>
            <!-- Secret Admin Button -->
            <button class="secret-admin-btn" id="adminStatusBtn" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i> Admin Access</button>
        </div>

        <!-- ADMIN PASSWORD POPUP MODAL -->
        <div class="admin-modal-overlay" id="adminModal">
            <div class="admin-modal-card">
                <h3 style="color: #ff003c; font-size: 16px; margin-bottom: 12px;"><i class="fa-solid fa-user-shield"></i> ยืนยันสิทธิ์ Admin</h3>
                <div class="form-group">
                    <label>ป้อนรหัสผ่านเพื่อเข้าสู่ระบบแอดมิน</label>
                    <input type="password" id="adminPassInput" placeholder="กรอกรหัสผ่านที่นี่...">
                </div>
                <button class="btn-primary" onclick="verifyAdminKey()">ตกลง</button>
                <button style="background: none; border: none; color: #888; font-size: 12px; margin-top: 10px; cursor: pointer;" onclick="closeAdminModal()">ยกเลิก</button>
            </div>
        </div>

        <!-- PAGE 1: HOME -->
        <div class="page-section active" id="pageHome">
            <!-- ADMIN CONTROL PANEL (จะแสดงเมื่อล็อกอินแอดมินผ่าน) -->
            <div id="adminPanel" style="display: none; background: #121212; border: 1px solid #ff003c; border-radius: 12px; padding: 16px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="color: #ff003c; font-size: 14px;">⚡ ADMIN CONTROL PANEL</h3>
                    <button onclick="logoutAdmin()" style="background: #333; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer;">ออกจากแอดมิน</button>
                </div>
                <div style="display: flex; gap: 6px; margin-bottom: 14px;">
                    <input type="text" id="newCatInput" placeholder="+ เพิ่มหมวดหมู่ใหม่..." style="flex: 1;">
                    <button onclick="addCategory()" style="background: #333; color: #fff; border: none; padding: 0 12px; border-radius: 6px; font-weight: 700; cursor: pointer;">เพิ่ม</button>
                </div>
                <div class="form-group"><label>ชื่อแอดออน</label><input type="text" id="addonTitle"></div>
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select id="addonCatSelect"></select>
                </div>
                <div class="form-group"><label>ลิงก์รูปภาพ (URL)</label><input type="url" id="addonImage"></div>
                <div class="form-group"><label>ลิงก์ดาวน์โหลด (URL)</label><input type="url" id="addonFile"></div>
                <button class="btn-primary" id="addonSubmitBtn" onclick="saveAddon()">POST ADDON</button>
            </div>

            <div class="categories-wrapper" id="categoryTabs"></div>
            <div class="addon-grid" id="addonList"></div>
        </div>

        <!-- PAGE 2: SEARCH -->
        <div class="page-section" id="pageSearch">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาแอดออนที่นี่..." oninput="filterAddons()">
            </div>
            <div class="addon-grid" id="searchResultList"></div>
        </div>

        <!-- PAGE 3: FAVORITES -->
        <div class="page-section" id="pageFavorites">
            <h3 style="font-size: 16px; margin-bottom: 14px; color: #ff003c;"><i class="fa-solid fa-heart"></i> รายการที่คุณกดใจไว้</h3>
            <div class="addon-grid" id="favoritesList"></div>
        </div>

        <!-- PAGE 4: SETTINGS / ABOUT -->
        <div class="page-section" id="pageSettings">
            <div style="background: #121212; padding: 20px; border-radius: 12px; border: 1px solid #222;">
                <h3 style="margin-bottom: 8px;">ADDON HUB v2.0</h3>
                <p style="color: #888; font-size: 13px;">ศูนย์รวมแอดออน Minecraft PE และ Bedrock Edition</p>
            </div>
        </div>

        <!-- Visitor Counter -->
        <div class="visitor-counter">
            👁️ จำนวนผู้เข้าชมเว็บไซต์ทั้งหมด: <span id="visitorCount" style="color: #ff003c; font-weight: 800;">1</span> คน
        </div>
    </div>

<script>
    const BIN_ID = '6ac65023ffd5d1605356252f';
    const MASTER_KEY = '$2a$10$ecvjzzTvc7XkSLw9/7L2gukhIW/w4H.PRNViTUYJoDHgaMRT1Qo.q';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let appData = {
        categories: ['ADD-ONS', 'WORLD', 'SKINS', 'TEXTURES'],
        addons: [],
        visitors: 102
    };

    let isAdmin = false;
    let selectedCat = 'ALL';
    let editingAddonId = null;
    let userFavorites = JSON.parse(localStorage.getItem('myFavorites') || '[]');

    window.onload = function() {
        checkAdminSession();
        renderCategories();
        renderAddons();
        loadCloudData();
    };

    function openAdminModal() {
        if (isAdmin) {
            alert("คุณเข้าสู่ระบบแอดมินอยู่แล้วครับ");
            return;
        }
        document.getElementById('adminModal').style.display = 'flex';
        document.getElementById('adminPassInput').focus();
    }

    function closeAdminModal() {
        document.getElementById('adminModal').style.display = 'none';
        document.getElementById('adminPassInput').value = '';
    }

    function verifyAdminKey() {
        const pass = document.getElementById('adminPassInput').value.trim();
        if (pass === "elite.1190") {
            isAdmin = true;
            localStorage.setItem('isAdmin', 'true');
            closeAdminModal();
            updateAdminUI();
            alert("ยินดีต้อนรับ Admin!");
        } else {
            alert("รหัสผ่านไม่ถูกต้อง!");
        }
    }

    function checkAdminSession() {
        if (localStorage.getItem('isAdmin') === 'true') {
            isAdmin = true;
        }
        updateAdminUI();
    }

    function updateAdminUI() {
        const btn = document.getElementById('adminStatusBtn');
        const panel = document.getElementById('adminPanel');

        if (isAdmin) {
            btn.innerHTML = '<i class="fa-solid fa-user-shield" style="color:#ff003c;"></i> Admin Active';
            btn.style.borderColor = '#ff003c';
            panel.style.display = 'block';
        } else {
            btn.innerHTML = '<i class="fa-solid fa-lock"></i> Admin Access';
            btn.style.borderColor = '#333';
            panel.style.display = 'none';
        }
        renderAddons();
    }

    function logoutAdmin() {
        isAdmin = false;
        localStorage.removeItem('isAdmin');
        updateAdminUI();
        alert("ออกจากสิทธิ์ Admin เรียบร้อย");
    }

    async function loadCloudData() {
        try {
            const res = await fetch(API_URL + '/latest', {
                headers: { 'X-Master-Key': MASTER_KEY, 'X-Bin-Meta': 'false' }
            });
            const data = await res.json();
            if (data) {
                if (data.record) appData = data.record;
                else if (data.addons) appData = data;
                updateVisitorCount();
                renderCategories();
                renderAddons();
            }
        } catch (e) {
            console.error("Cloud load error", e);
        }
    }

    async function syncToCloud() {
        try {
            await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify(appData)
            });
        } catch (e) {
            console.error("Cloud sync error", e);
        }
    }

    function addCategory() {
        const name = document.getElementById('newCatInput').value.trim().toUpperCase();
        if (name && !appData.categories.includes(name)) {
            appData.categories.push(name);
            document.getElementById('newCatInput').value = '';
            syncToCloud();
            renderCategories();
        }
    }

    function renderCategories() {
        const wrap = document.getElementById('categoryTabs');
        const select = document.getElementById('addonCatSelect');
        wrap.innerHTML = `<button class="cat-btn ${selectedCat === 'ALL' ? 'active' : ''}" onclick="filterCat('ALL')">ALL</button>`;
        select.innerHTML = '';

        if (appData.categories) {
            appData.categories.forEach(c => {
                wrap.innerHTML += `<button class="cat-btn ${selectedCat === c ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`;
                select.innerHTML += `<option value="${c}">${c}</option>`;
            });
        }
    }

    function filterCat(cat) {
        selectedCat = cat;
        renderCategories();
        renderAddons();
    }

    async function saveAddon() {
        const title = document.getElementById('addonTitle').value.trim();
        const cat = document.getElementById('addonCatSelect').value;
        const img = document.getElementById('addonImage').value.trim();
        const file = document.getElementById('addonFile').value.trim();

        if (!title || !img || !file) return alert("กรอกข้อมูลให้ครบถ้วน");

        if (editingAddonId) {
            const idx = appData.addons.findIndex(a => a.id === editingAddonId);
            if (idx !== -1) {
                appData.addons[idx] = { id: editingAddonId, title, category: cat, image: img, downloadUrl: file };
            }
            editingAddonId = null;
            document.getElementById('addonSubmitBtn').innerText = "POST ADDON";
        } else {
            const newAddon = { id: Date.now(), title, category: cat, image: img, downloadUrl: file };
            if(!appData.addons) appData.addons = [];
            appData.addons.unshift(newAddon);
        }

        document.getElementById('addonTitle').value = '';
        document.getElementById('addonImage').value = '';
        document.getElementById('addonFile').value = '';

        syncToCloud();
        renderAddons();
    }

    function editAddon(id) {
        const item = appData.addons.find(a => a.id === id);
        if (!item) return;
        editingAddonId = id;
        document.getElementById('addonTitle').value = item.title;
        document.getElementById('addonCatSelect').value = item.category;
        document.getElementById('addonImage').value = item.image;
        document.getElementById('addonFile').value = item.downloadUrl;
        document.getElementById('addonSubmitBtn').innerText = "UPDATE ADDON";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteAddon(id) {
        if (confirm("ต้องการลบใช่หรือไม่?")) {
            appData.addons
