<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDON HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            padding-bottom: 70px;
        }

        /* Navigation Bar */
        .navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        @media (min-width: 768px) {
            body { padding-bottom: 0; padding-left: 80px; }
            .navbar {
                top: 0; left: 0; width: 80px; height: 100vh;
                flex-direction: column; justify-content: flex-start; gap: 30px;
                padding-top: 30px; border-top: none; border-right: 1px solid #222;
            }
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .nav-btn.active {
            background: #ff003c;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.5);
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 14px;
        }

        /* Auth Screen Modal */
        .auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }

        .auth-card {
            background: #121212;
            border: 1px solid #ff003c;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 25px rgba(255,0,60,0.2);
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
        }

        .auth-tab {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .auth-tab.active {
            color: #ff003c;
            border-bottom: 2px solid #ff003c;
        }

        .error-msg {
            color: #ff3355;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
        }

        .header h1 span { color: #ff003c; }

        .user-tag {
            font-size: 12px;
            background: #1a1a1a;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #333;
            color: #aaa;
        }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: #121212;
            border: 1px solid #222;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-input:focus { border-color: #ff003c; }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        /* Categories Bar */
        .categories-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .cat-btn {
            background: #121212;
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            border-color: #ff003c;
            color: #ff003c;
            background: rgba(255, 0, 60, 0.1);
        }

        /* Forms & Inputs */
        .form-group { margin-bottom: 12px; }

        label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #ff003c;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Addon List & Cards */
        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .addon-card {
            background: #121212;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .addon-img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #181818;
            position: relative;
        }

        .addon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .like-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            backdrop-filter: blur(4px);
        }

        .like-btn.liked { color: #ff003c; }

        .addon-content { padding: 14px; }

        .addon-category-tag {
            font-size: 10px;
            color: #ff003c;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .addon-title {
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .btn-download {
            display: block;
            text-align: center;
            padding: 10px;
            background: #181818;
            color: #ff003c;
            border: 1px solid #ff003c;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 800;
            font-size: 12px;
        }

        .admin-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
        }

        .admin-btn {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 800;
            border: none;
            cursor: pointer;
        }

        .edit-btn { background: #ffaa00; color: #000; }
        .delete-btn { background: #ff003c; color: #fff; }

        .visitor-counter {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: #121212;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
            font-size: 12px;
            color: #666;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchPage('home', this)"><i class="fa-solid fa-gamepad"></i></button>
        <button class="nav-btn" onclick="switchPage('search', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-btn" onclick="switchPage('favorites', this)"><i class="fa-solid fa-heart"></i></button>
        <button class="nav-btn" onclick="switchPage('settings', this)"><i class="fa-solid fa-gear"></i></button>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ADDON<span>HUB</span></h1>
            <div class="user-tag" id="userTag">ผู้ใช้ทั่วไป</div>
        </div>

        <!-- AUTH MODAL -->
        <div class="auth-overlay" id="authModal">
            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLogin" onclick="setAuthTab('login')">ลงชื่อเข้าใช้</button>
                    <button class="auth-tab" id="tabRegister" onclick="setAuthTab('register')">สมัครสมาชิก</button>
                </div>

                <!-- Error Message Alert Box -->
                <div class="error-msg" id="authError"></div>

                <!-- Login Form -->
                <div id="loginForm">
                    <div class="form-group">
                        <label>ชื่อผู้ใช้ (Username)</label>
                        <input type="text" id="loginUsername" placeholder="กรอกชื่อผู้ใช้">
                    </div>
                    <div class="form-group">
                        <label>รหัสผ่าน (Password)</label>
                        <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน">
                    </div>
                    <button class="btn-primary" onclick="handleLogin()">เข้าสู่ระบบ</button>
                </div>

                <!-- Register Form -->
                <div id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label>ตั้งชื่อผู้ใช้ (Username)</label>
                        <input type="text" id="regUsername" placeholder="ตั้งชื่อผู้ใช้ของคุณ">
                    </div>
                    <div class="form-group">
                        <label>ตั้งรหัสผ่าน (Password)</label>
                        <input type="password" id="regPassword" placeholder="ตั้งรหัสผ่าน">
                    </div>
                    <button class="btn-primary" onclick="handleRegister()">สร้างบัญชี</button>
                </div>
            </div>
        </div>

        <!-- PAGE 1: HOME -->
        <div class="page-section active" id="pageHome">
            <div id="adminPanel" style="display: none; background: #121212; border: 1px solid #ff003c; border-radius: 12px; padding: 16px; margin-bottom: 20px;">
                <h3 style="color: #ff003c; font-size: 14px; margin-bottom: 12px;">⚡ ADMIN CONTROL PANEL</h3>
                <div style="display: flex; gap: 6px; margin-bottom: 14px;">
                    <input type="text" id="newCatInput" placeholder="+ หมวดหมู่ใหม่..." style="flex: 1;">
                    <button onclick="addCategory()" style="background: #333; color: #fff; border: none; padding: 0 12px; border-radius: 6px; font-weight: 700;">เพิ่ม</button>
                </div>
                <div class="form-group"><label>ชื่อแอดออน</label><input type="text" id="addonTitle"></div>
                <div class="form-group">
                    <label>หมวดหมู่</label>
                    <select id="addonCatSelect"></select>
                </div>
                <div class="form-group"><label>ลิงก์รูปภาพ (URL)</label><input type="url" id="addonImage"></div>
                <div class="form-group"><label>ลิงก์ดาวน์โหลด (URL)</label><input type="url" id="addonFile"></div>
                <button class="btn-primary" id="addonSubmitBtn" onclick="saveAddon()">POST ADDON</button>
            </div>

            <div class="categories-wrapper" id="categoryTabs"></div>
            <div class="addon-grid" id="addonList"></div>
        </div>

        <!-- PAGE 2: SEARCH -->
        <div class="page-section" id="pageSearch">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาแอดออนที่นี่..." oninput="filterAddons()">
            </div>
            <div class="addon-grid" id="searchResultList"></div>
        </div>

        <!-- PAGE 3: FAVORITES -->
        <div class="page-section" id="pageFavorites">
            <h3 style="font-size: 16px; margin-bottom: 14px; color: #ff003c;"><i class="fa-solid fa-heart"></i> รายการที่คุณกดใจไว้</h3>
            <div class="addon-grid" id="favoritesList"></div>
        </div>

        <!-- PAGE 4: SETTINGS / ACCOUNT -->
        <div class="page-section" id="pageSettings">
            <div style="background: #121212; padding: 20px; border-radius: 12px; border: 1px solid #222;">
                <h3 style="margin-bottom: 10px;">บัญชีของคุณ</h3>
                <p style="color: #888; font-size: 13px; margin-bottom: 16px;" id="accountName">Username: -</p>
                <button onclick="logout()" style="background: #ff003c; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">ออกจากระบบ</button>
            </div>
        </div>

        <!-- Visitor Counter -->
        <div class="visitor-counter">
            👁️ จำนวนผู้เข้าชมเว็บไซต์ทั้งหมด: <span id="visitorCount" style="color: #ff003c; font-weight: 800;">1</span> คน
        </div>
    </div>

<script>
    const BIN_ID = '6ac65023ffd5d1605356252f';
    const MASTER_KEY = '$2a$10$ecvjzzTvc7XkSLw9/7L2gukhIW/w4H.PRNViTUYJoDHgaMRT1Qo.q';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let appData = {
        users: [],
        categories: ['ADD-ONS', 'WORLD', 'SKINS', 'TEXTURES'],
        addons: [],
        visitors: 102
    };

    let currentUser = null;
    let selectedCat = 'ALL';
    let editingAddonId = null;
    let userFavorites = JSON.parse(localStorage.getItem('myFavorites') || '[]');

    window.onload = function() {
        checkLoginSession();
        renderCategories();
        renderAddons();
        loadCloudData();
    };

    function showError(msg) {
        const errBox = document.getElementById('authError');
        errBox.innerText = msg;
        errBox.style.display = 'block';
    }

    function clearError() {
        const errBox = document.getElementById('authError');
        errBox.innerText = '';
        errBox.style.display = 'none';
    }

    async function loadCloudData() {
        try {
            const res = await fetch(API_URL + '/latest', {
                headers: { 'X-Master-Key': MASTER_KEY, 'X-Bin-Meta': 'false' }
            });
            const data = await res.json();
            if (data) {
                if (data.record) appData = data.record;
                else if (data.addons) appData = data;
                updateVisitorCount();
                renderCategories();
                renderAddons();
            }
        } catch (e) {
            console.error("Cloud load error", e);
        }
    }

    async function syncToCloud() {
        try {
            await fetch(API_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
                body: JSON.stringify(appData)
            });
        } catch (e) {
            console.error("Cloud sync error", e);
        }
    }

    function checkLoginSession() {
        const saved = localStorage.getItem('currentUser');
        if (saved) {
            currentUser = JSON.parse(saved);
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('userTag').innerText = currentUser.username;
            document.getElementById('accountName').innerText = "Username: " + currentUser.username;
            if (currentUser.isAdmin) {
                document.getElementById('adminPanel').style.display = 'block';
            }
        } else {
            document.getElementById('authModal').style.display = 'flex';
        }
    }

    function setAuthTab(tab) {
        clearError();
        document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
        document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
    }

    function handleRegister() {
        clearError();
        const u = document.getElementById('regUsername').value.trim();
        const p = document.getElementById('regPassword').value.trim();

        if (!u || !p) return showError("⚠️ กรุณากรอกข้อมูลให้ครบถ้วน");
        if (appData.users.some(x => x.username === u) || u === "elite.1190") {
            return showError("⚠️ ชื่อผู้ใช้นี้ถูกใช้งานแล้ว");
        }

        const newUser = { username: u, password: p, isAdmin: false };
        appData.users.push(newUser);
        syncToCloud();
        
        loginUser(newUser);
        alert("สมัครสมาชิกสำเร็จ!");
    }

    function handleLogin() {
        clearError();
        const u = document.getElementById('loginUsername').value.trim();
        const p = document.getElementById('loginPassword').value.trim();

        if (!u || !p) return showError("⚠️ กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");

        // Admin Special Check
        if (u === "elite.1190" && p === "black.1190") {
            const adminUser = { username: "elite.1190", isAdmin: true };
            loginUser(adminUser);
            return;
        }

        const found = appData.users.find(x => x.username === u && x.password === p);
        if (found) {
            loginUser(found);
        } else {
            showError("⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!");
        }
    }

    function loginUser(user) {
        currentUser = user;
        localStorage.setItem('currentUser', JSON.stringify(user));
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('userTag').innerText = user.username;
        document.getElementById('accountName').innerText = "Username: " + user.username;
        if (user.isAdmin) document.getElementById('adminPanel').style.display = 'block';
        renderAddons();
    }

    function logout() {
        localStorage.removeItem('currentUser');
        location.reload();
    }

    function addCategory() {
        const name = document.getElementById('newCatInput').value.trim().toUpperCase();
        if (name && !appData.categories.includes(name)) {
            appData.categories.push(name);
            document.getElementById('newCatInput').value = '';
            syncToCloud();
