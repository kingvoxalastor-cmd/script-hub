<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADDON HUB - Minecraft Addons Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #12141c;
            --accent-red: #ff0055;
            --accent-red-glow: rgba(255, 0, 85, 0.4);
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
            --border-color: #1f2330;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 12px;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.08) 0%, transparent 70%);
        }

        .container {
            width: 100%;
            max-width: 580px;
            padding-bottom: 90px;
        }

        /* Header Design */
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header h1 span {
            color: var(--accent-red);
            text-shadow: 0 0 15px var(--accent-red-glow);
        }

        .header p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        /* Floating Admin Button */
        .floating-admin-btn {
            position: fixed;
            bottom: 24px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--accent-red);
            color: var(--accent-red);
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            padding: 12px 22px;
            border-radius: 50px;
            box-shadow: 0 6px 20px var(--accent-red-glow);
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .floating-admin-btn:hover {
            background: var(--accent-red);
            color: #fff;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 25px rgba(255, 0, 85, 0.6);
        }

        /* Modal Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex !important;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--accent-red);
            border-radius: 16px;
            padding: 28px 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 40px var(--accent-red-glow);
            text-align: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-red);
            margin-bottom: 6px;
        }

        .modal-sub {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px 14px;
            background: #181b26;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-input:focus {
            border-color: var(--accent-red);
        }

        .modal-btn-group {
            display: flex;
            gap: 10px;
        }

        .modal-btn-login {
            flex: 2;
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-btn-close {
            flex: 1;
            background: #1f2330;
            color: var(--text-sub);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Admin Form Card */
        .admin-card {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--accent-red);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 30px var(--accent-red-glow);
        }

        .admin-card.active {
            display: block;
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--accent-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
        }

        input[type="text"], input[type="url"], select {
            width: 100%;
            padding: 12px;
            background: #181b26;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-red);
        }

        .btn-group-submit {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-submit {
            flex: 2;
            padding: 12px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-cancel-edit {
            flex: 1;
            padding: 12px;
            background: #1f2330;
            color: var(--text-sub);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: none;
        }

        .logout-btn {
            background: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        /* Search Section */
        .search-section {
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 15px var(--accent-red-glow);
        }

        /* Category Filter Tabs */
        .category-section {
            margin-bottom: 22px;
        }

        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .cat-tab {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-sub);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-tab.active {
            background: rgba(255, 0, 85, 0.15);
            border-color: var(--accent-red);
            color: var(--accent-red);
            box-shadow: 0 0 12px var(--accent-red-glow);
        }

        /* Addon List Grid */
        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .addon-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .addon-card:hover {
            border-color: var(--accent-red);
            transform: translateY(-2px);
        }

        .addon-img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #181b26;
            overflow: hidden;
            position: relative;
        }

        .addon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .addon-card:hover .addon-img {
            transform: scale(1.03);
        }

        .addon-content {
            padding: 18px;
        }

        .addon-category-tag {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-red);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .addon-title {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .btn-download {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 12px;
            background: rgba(255, 0, 85, 0.1);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            text-align: center;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 20px var(--accent-red-glow);
        }

        .empty-text {
            text-align: center;
            color: var(--text-sub);
            padding: 60px 20px;
            font-size: 14px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }

        /* Admin Action Buttons */
        .admin-controls {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            gap: 6px;
            z-index: 10;
        }

        .admin-mode .admin-controls {
            display: flex;
        }

        .edit-btn {
            background: rgba(255, 170, 0, 0.9);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 800;
        }

        .delete-btn {
            background: rgba(255, 0, 85, 0.9);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 800;
        }
    </style>
</head>
<body>

<!-- Floating Admin Button -->
<button class="floating-admin-btn" id="adminFloatingBtn" type="button" onclick="handleAdminButtonClick()">
    ⚡ ADMIN
</button>

<!-- UI Modal Log in -->
<div class="modal-overlay" id="adminLoginModal">
    <div class="modal-box">
        <div class="modal-title">🔐 ADMIN ACCESS</div>
        <div class="modal-sub">กรอกรหัสผ่านเพื่อเข้าสู่ระบบจัดการแอดออน</div>
        <input type="password" class="modal-input" id="passInput" placeholder="กรอกรหัสผ่าน..." onkeyup="handleKey(event)">
        <div class="modal-btn-group">
            <button class="modal-btn-login" type="button" onclick="checkPassword()">เข้าสู่ระบบ</button>
            <button class="modal-btn-close" type="button" onclick="closeLoginModal()">ยกเลิก</button>
        </div>
    </div>
</div>

<div class="container" id="mainContainer">
    <!-- Header -->
    <div class="header">
        <h1>ADDON<span>HUB</span></h1>
        <p>ศูนย์รวมแอดออน Minecraft คุณภาพสูง</p>
    </div>

    <!-- Admin Form -->
    <div class="admin-card" id="adminForm">
        <div class="card-title">
            <span id="formHeaderTitle">⚡ ADD NEW ADDON</span>
            <button class="logout-btn" type="button" onclick="logoutAdmin()">LOGOUT</button>
        </div>

        <div class="form-group" style="background: #181b26; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 16px;">
            <label style="color: var(--accent-red); font-weight: bold;">➕ เพิ่มหมวดหมู่ใหม่</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="newCatInput" placeholder="เช่น: เอาชีวิตรอด, ผี, อาวุธ">
                <button type="button" onclick="addCategory()" style="background: #282c3c; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap;">เพิ่ม</button>
            </div>
        </div>

        <div class="form-group">
            <label>ชื่อแอดออน</label>
            <input type="text" id="addonTitle" placeholder="เช่น: CARRY MORE Add-On v1.0">
        </div>
        <div class="form-group">
            <label>หมวดหมู่แอดออน</label>
            <select id="addonCategory"></select>
        </div>
        <div class="form-group">
            <label>ลิงก์รูปภาพตัวอย่าง (URL)</label>
            <input type="url" id="addonImage" placeholder="https://...">
        </div>
        <div class="form-group">
            <label>ลิงก์ดาวน์โหลดแอดออน (MediaFire / Google Drive)</label>
            <input type="url" id="addonFile" placeholder="https://...">
        </div>
        
        <div class="btn-group-submit">
            <button class="btn-submit" id="submitBtn" type="button" onclick="handleSubmit()">POST ADDON</button>
            <button class="btn-cancel-edit" id="cancelEditBtn" type="button" onclick="resetForm()">CANCEL</button>
        </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 ค้นหาชื่อแอดออน..." oninput="handleSearch()">
    </div>

    <!-- Category Filter Tabs -->
    <div class="category-section">
        <div class="category-tabs" id="categoryTabs">
            <button class="cat-tab active" type="button" onclick="filterCategory('ALL')">ALL</button>
        </div>
    </div>

    <!-- Addon List Grid -->
    <div class="addon-grid" id="addonList">
        <div class="empty-text">กำลังโหลดแอดออนจากเซิร์ฟเวอร์...</div>
    </div>
</div>

<script>
    const BIN_ID = '6ac65023ffd5d1605356252f';
    const MASTER_KEY = '$2a$10$ecvjzzTvc7XkSLw9/7L2gukhIW/w4H.PRNViTUYJoDHgaMRT1Qo.q';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let appData = {
        categories: ['เอาชีวิตรอด', 'ผี', 'อาวุธ'],
        addons: []
    };
    
    let currentCategory = 'ALL';
    let searchQuery = '';
    let editingAddonId = null;
    let isAdminLoggedIn = false;

    document.addEventListener("DOMContentLoaded", function() {
        loadAddons();
    });

    function handleAdminButtonClick() {
        if (isAdminLoggedIn) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            openLoginModal();
        }
    }

    function openLoginModal() {
        const modal = document.getElementById('adminLoginModal');
        modal.classList.add('active');
        const input = document.getElementById('passInput');
        input.value = '';
        input.focus();
    }

    function closeLoginModal() {
        document.getElementById('adminLoginModal').classList.remove('active');
    }

    function handleKey(e) {
        if (e.key === 'Enter') checkPassword();
    }

    function checkPassword() {
        const pass = document.getElementById('passInput').value;
        if (pass === "elite.1190") {
            isAdminLoggedIn = true;
            closeLoginModal();
            document.getElementById('adminForm').classList.add('active');
            document.getElementById('mainContainer').classList.add('admin-mode');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            alert("รหัสผ่านไม่ถูกต้อง!");
            document.getElementById('passInput').value = '';
        }
    }

    function logoutAdmin() {
        isAdminLoggedIn = false;
        document.getElementById('adminForm').classList.remove('active');
        document.getElementById('mainContainer').classList.remove('admin-mode');
        resetForm();
    }

    function loadAddons() {
        fetch(API_URL + '/latest', {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        })
        .then(res => res.json())
        .then(data => {
            let recordData = data;
            if (data && data.record) recordData = data.record;

            if (Array.isArray(recordData)) {
                appData.addons = recordData;
            } else if (typeof recordData === 'object' && recordData !== null) {
                appData.categories = recordData.categories || ['เอาชีวิตรอด', 'ผี', 'อาวุธ'];
                appData.addons = recordData.addons || [];
            }

            renderCategories();
            renderAddons();
        })
        .catch(err => {
            console.error("Error loading addons:", err);
            document.getElementById('addonList').innerHTML = '<div class="empty-text">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ในขณะนี้</div>';
        });
    }

    function addCategory() {
        const input = document.getElementById('newCatInput');
        const catName = input.value.trim();
        if (!catName) return;

        if (!appData.categories.includes(catName)) {
            appData.categories.push(catName);
            input.value = '';
            syncToCloud(appData);
            renderCategories();
            alert(`เพิ่มหมวดหมู่ "${catName}" เรียบร้อยแล้ว!`);
        } else {
            alert("มีหมวดหมู่นี้อยู่แล้ว!");
        }
    }

    function renderCategories() {
        const tabsWrap = document.getElementById('categoryTabs');
        const selectWrap = document.getElementById('addonCategory');

        tabsWrap.innerHTML = `<button class="cat-tab ${currentCategory === 'ALL' ? 'active' : ''}" type="button" onclick="filterCategory('ALL')">ALL</button>`;
        selectWrap.innerHTML = '';

        appData.categories.forEach(cat => {
            tabsWrap.innerHTML += `<button class="cat-tab ${currentCategory === cat ? 'active' : ''}" type="button" onclick="filterCategory('${cat}')">${cat}</button>`;
            selectWrap.innerHTML += `<option value="${cat}">${cat}</option>`;
