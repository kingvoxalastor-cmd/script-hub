<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINECRAFT ADDON HUB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 3px solid #388e3c; /* สีเขียว Minecraft */
        }

        .header h1 {
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .header span {
            color: #4caf50;
        }

        /* ปุ่มซ่อนรหัสผ่าน Admin */
        .admin-lock-btn {
            background: transparent;
            border: none;
            color: #444;
            font-size: 14px;
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: color 0.3s;
        }

        .admin-lock-btn:hover {
            color: #888;
        }

        /* โซนลงแอดออน (สำหรับ Admin เท่านั้น) */
        .admin-card {
            display: none; /* ซ่อนไว้เป็นค่าเริ่มต้น */
            background: #1e1e1e;
            border: 2px solid #4caf50;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.2);
        }

        .admin-card.active {
            display: block; /* แสดงผลเมื่อใส่รหัสผ่านถูก */
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4caf50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
            font-size: 14px;
        }

        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #4caf50;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #388e3c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #2e7d32;
        }

        .btn-submit:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* โซนแสดงรายการแอดออนสำหรับผู้ใช้อื่นๆ */
        .addon-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .addon-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .addon-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #2a2a2a;
            display: block;
        }

        .addon-content {
            padding: 15px;
        }

        .addon-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            transition: background 0.3s;
        }

        .btn-download:hover {
            background: #388e3c;
        }

        .empty-text {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 16px;
        }

        .logout-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>MINECRAFT <span>ADDON HUB</span></h1>
        <!-- ปุ่มซ่อนรหัสผ่าน เล็กๆ อยู่ตรงมุม -->
        <button class="admin-lock-btn" onclick="loginAdmin()" title="Admin Login">🔒</button>
    </div>

    <!-- ฟอร์มเพิ่มแอดออน (โชว์เฉพาะเวลากรอกรหัสผ่านถูก) -->
    <div class="admin-card" id="adminForm">
        <div class="card-title">
            <span>➕ ลงแอดออนใหม่ (โหมดผู้ดูแลระบบ)</span>
            <button class="logout-btn" onclick="logoutAdmin()">ออกจากระบบ</button>
        </div>
        <div class="form-group">
            <label>ชื่อแอดออน</label>
            <input type="text" id="addonTitle" placeholder="เช่น: Furniture Addon v2.0" required>
        </div>
        <div class="form-group">
            <label>เลือกรูปภาพตัวอย่างแอดออน (จากในเครื่อง)</label>
            <input type="file" id="addonImage" accept="image/*" required>
        </div>
        <div class="form-group">
            <label>เลือกไฟล์แอดออน (ไฟล์ .mcaddon / .mcpack / .zip จากในเครื่อง)</label>
            <input type="file" id="addonFile" required>
        </div>
        <button class="btn-submit" id="submitBtn" onclick="uploadAddon()">โพสต์แอดออนลงเว็บ</button>
    </div>

    <!-- รายการแอดออนทั้งหมด -->
    <h2 style="font-size: 18px; margin-bottom: 15px; color: #bbb;">📦 แอดออนทั้งหมด</h2>
    <div class="addon-grid" id="addonList">
        <div class="empty-text">กำลังโหลดแอดออน...</div>
    </div>
</div>

<script>
    // การเชื่อมตั้งค่า JSONBin.io
    const BIN_ID = '6ac4fd7eac6210605a193eb2';
    const MASTER_KEY = '$2a$10$c050I32SC1yvzC7XK5SW1e-q3X3bW7I';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let addonsData = [];

    window.onload = function() {
        fetchAddons();
    };

    // ฟังก์ชันกดปุ่มล็อค เพื่อใส่รหัสผ่าน
    function loginAdmin() {
        const password = prompt("กรุณาใส่รหัสผ่านผู้ดูแลระบบ:");
        if (password === "black.1234") {
            alert("ยินดีต้อนรับ! ปลดล็อคระบบลงแอดออนแล้ว");
            document.getElementById('adminForm').classList.add('active');
        } else if (password !== null) {
            alert("รหัสผ่านไม่ถูกต้อง!");
        }
    }

    // ออกจากระบบ
    function logoutAdmin() {
        document.getElementById('adminForm').classList.remove('active');
    }

    // ดึงข้อมูลแอดออนจาก JSONBin
    function fetchAddons() {
        fetch(API_URL, {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        })
        .then(res => res.json())
        .then(data => {
            addonsData = Array.isArray(data) ? data : [];
            renderAddons();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('addonList').innerHTML = '<div class="empty-text">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
        });
    }

    // แปลงไฟล์เป็น Base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // ฟังก์ชันอัปโหลดแอดออน
    async function uploadAddon() {
        const title = document.getElementById('addonTitle').value.trim();
        const imgInput = document.getElementById('addonImage');
        const fileInput = document.getElementById('addonFile');
        const submitBtn = document.getElementById('submitBtn');

        if (!title || !imgInput.files[0] || !fileInput.files[0]) {
            alert("กรุณากรอกชื่อแอดออน, เลือกรูปภาพ และเลือกไฟล์แอดออนให้ครบถ้วน!");
            return;
        }

        // ตรวจสอบขนาดไฟล์รูป (ไม่ควรเกิน 2MB)
        if (imgInput.files[0].size > 2 * 1024 * 1024) {
            alert("ไฟล์รูปภาพมีขนาดใหญ่เกินไป (กรุณาใช้รูปไม่เกิน 2MB)");
            return;
        }

        // ตรวจสอบขนาดไฟล์แอดออน
        if (fileInput.files[0].size > 3 * 1024 * 1024) {
            alert("ไฟล์แอดออนมีขนาดใหญ่เกินไป (ระบบรองรับไฟล์ขนาดไม่เกิน 3MB)");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังแปลงไฟล์และอัปโหลด...";

        try {
            const imgBase64 = await fileToBase64(imgInput.files[0]);
            const fileBase64 = await fileToBase64(fileInput.files[0]);

            const newAddon = {
                id: Date.now(),
                title: title,
                image: imgBase64,
                fileData: fileBase64,
                fileName: fileInput.files[0].name
            };

            addonsData.unshift(newAddon);

            const res = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY
                },
                body: JSON.stringify(addonsData)
            });

            if (res.ok) {
                alert("โพสต์แอดออนเรียบร้อยแล้ว!");
                document.getElementById('addonTitle').value = '';
                document.getElementById('addonImage').value = '';
                document.getElementById('addonFile').value = '';
                renderAddons();
            } else {
                throw new Error("บันทึกไม่สำเร็จ");
            }
        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการอัปโหลดไฟล์ (ไฟล์อาจมีขนาดใหญ่เกินไป)");
            addonsData.shift();
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "โพสต์แอดออนลงเว็บ";
        }
    }

    // แสดงรายการแอดออนบนหน้าเว็บ
    function renderAddons() {
        const list = document.getElementById('addonList');
        list.innerHTML = '';

        if (addonsData.length === 0) {
            list.innerHTML = '<div class="empty-text">ยังไม่มีแอดออนในระบบ</div>';
            return;
        }

        addonsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'addon-card';

            card.innerHTML = `
                <img src="${item.image}" class="addon-img" alt="${escapeHtml(item.title)}">
                <div class="addon-content">
                    <div class="addon-title">${escapeHtml(item.title)}</div>
                    <a href="${item.fileData}" download="${item.fileName || 'addon.mcaddon'}" class="btn-download">
                        ⬇️ ดาวน์โหลดแอดออน
                    </a>
                </div>
            `;

            list.appendChild(card);
        });
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
