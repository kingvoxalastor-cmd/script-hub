<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRIPT HUB - ONLINE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #f1f1f1;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e50914;
        }

        .header h1 {
            color: #ffffff;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .header span {
            color: #e50914;
            font-weight: bold;
        }

        .card {
            background: #18181c;
            border: 1px solid #282830;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaaaaa;
            font-size: 14px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background: #0f0f12;
            border: 1px solid #33333e;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #e50914;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        input[type="file"] {
            background: #0f0f12;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            color: #aaa;
            border: 1px dashed #33333e;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #b20710;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .script-item {
            background: #18181c;
            border: 1px solid #282830;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .script-title {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }

        .script-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .code-box {
            background: #09090b;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #00ff66;
            word-break: break-all;
            position: relative;
            margin-bottom: 10px;
            max-height: 120px;
            overflow-y: auto;
        }

        .btn-copy {
            background: #282830;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-copy:hover {
            background: #383845;
        }

        .empty-text {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SCRIPT <span>HUB</span></h1>
        <small style="color:#888;">ออนไลน์ ☁️</small>
    </div>

    <!-- โซนเพิ่มสคริปต์ -->
    <div class="card">
        <div class="card-title">เพิ่มผลงานสคริปต์</div>
        <div class="form-group">
            <label>ชื่อสคริปต์</label>
            <input type="text" id="scriptTitle" placeholder="ใส่ชื่อสคริปต์..." required>
        </div>
        <div class="form-group">
            <label>เลือกรูปภาพตัวอย่างจากในเครื่อง (ใส่หรือไม่ใส่ก็ได้)</label>
            <input type="file" id="scriptImage" accept="image/*">
        </div>
        <div class="form-group">
            <label>ตัวสคริปต์ (Source Code)</label>
            <textarea id="scriptCode" placeholder="วางโค้ดสคริปต์..." required></textarea>
        </div>
        <button class="btn" id="submitBtn" onclick="addScript()">ลงผลงาน</button>
    </div>

    <!-- โซนแสดงสคริปต์ทั้งหมด -->
    <div class="card-title">รายการสคริปต์ทั้งหมดในระบบ</div>
    <div id="scriptList">
        <div class="empty-text">กำลังโหลดข้อมูลสคริปต์...</div>
    </div>
</div>

<script>
    // การตั้งค่า JSONBin.io
    const BIN_ID = '6ac4fd7eac6210605a193eb2';
    const MASTER_KEY = '$2a$10$c050I32SC1yvzC7XK5SW1e-q3X3bW7I';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let scriptsData = [];

    // ดึงข้อมูลเมื่อโหลดหน้าเว็บ
    window.onload = function() {
        fetchScripts();
    };

    // ฟังก์ชันดึงข้อมูลสคริปต์จาก JSONBin
    function fetchScripts() {
        fetch(API_URL, {
            method: 'GET',
            headers: {
                'X-Master-Key': MASTER_KEY,
                'X-Bin-Meta': 'false'
            }
        })
        .then(response => {
            if (!response.ok) throw new Error('ไม่สามารถดึงข้อมูลได้');
            return response.json();
        })
        .then(data => {
            scriptsData = Array.isArray(data) ? data : [];
            renderScripts();
        })
        .catch(err => {
            console.error(err);
            document.getElementById('scriptList').innerHTML = '<div class="empty-text" style="color:#e50914;">เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
        });
    }

    // ฟังก์ชันบันทึกข้อมูลสคริปต์
    function addScript() {
        const title = document.getElementById('scriptTitle').value.trim();
        const code = document.getElementById('scriptCode').value.trim();
        const imageInput = document.getElementById('scriptImage');
        const submitBtn = document.getElementById('submitBtn');

        if (!title || !code) {
            alert('กรุณากรอกชื่อสคริปต์และโค้ดสคริปต์ให้ครบถ้วน');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'กำลังบันทึกข้อมูล...';

        if (imageInput.files && imageInput.files[0]) {
            const file = imageInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                const imgBase64 = e.target.result;
                saveToCloud(title, code, imgBase64);
            };

            reader.readAsDataURL(file);
        } else {
            saveToCloud(title, code, null);
        }
    }

    // ฟังก์ชันส่งข้อมูลไปยัง JSONBin
    function saveToCloud(title, code, imageBase64) {
        const newScript = {
            id: Date.now(),
            title: title,
            code: code,
            image: imageBase64,
            date: new Date().toLocaleDateString('th-TH')
        };

        scriptsData.unshift(newScript);

        fetch(API_URL, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Master-Key': MASTER_KEY
            },
            body: JSON.stringify(scriptsData)
        })
        .then(response => {
            if (!response.ok) throw new Error('บันทึกไม่สำเร็จ');
            return response.json();
        })
        .then(data => {
            alert('ลงผลงานสำเร็จเรียบร้อยแล้ว!');
            document.getElementById('scriptTitle').value = '';
            document.getElementById('scriptCode').value = '';
            document.getElementById('scriptImage').value = '';
            renderScripts();
        })
        .catch(err => {
            console.error(err);
            alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
            scriptsData.shift(); // ลบรายการล่าสุดออกหากบันทึกไม่สำเร็จ
        })
        .finally(() => {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = false;
            submitBtn.innerText = 'ลงผลงาน';
        });
    }

    // ฟังก์ชันแสดงรายการสคริปต์บนหน้าเว็บ
    function renderScripts() {
        const listDiv = document.getElementById('scriptList');
        listDiv.innerHTML = '';

        if (scriptsData.length === 0) {
            listDiv.innerHTML = '<div class="empty-text">ยังไม่มีผลงานสคริปต์ในระบบ</div>';
            return;
        }

        scriptsData.forEach(item => {
            const scriptCard = document.createElement('div');
            scriptCard.className = 'script-item';

            let imgHtml = item.image ? `<img src="${item.image}" class="script-img" alt="รูปตัวอย่าง">` : '';

            scriptCard.innerHTML = `
                <div class="script-header">
                    <div class="script-title">${escapeHtml(item.title)}</div>
                    <small style="color:#666;">${item.date || ''}</small>
                </div>
                ${imgHtml}
                <div class="code-box">${escapeHtml(item.code)}</div>
                <button class="btn-copy" onclick="copyCode(this, \`${escapeHtml(item.code)}\`)">คัดลอกโค้ด</button>
            `;

            listDiv.appendChild(scriptCard);
        });
    }

    // ฟังก์ชันคัดลอกโค้ด
    function copyCode(btn, codeText) {
        navigator.clipboard.writeText(codeText).then(() => {
            const originalText = btn.innerText;
            btn.innerText = 'คัดลอกแล้ว!';
            btn.style.background = '#00ff66';
            btn.style.color = '#000';
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = '#282830';
                btn.style.color = '#fff';
            }, 2000);
        });
    }

    // ฟังก์ชันป้องกัน XSS
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }
</script>

</body>
</html>
