<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN LOGIN - ADDON HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: #121212;
            border: 1px solid #ff003c;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.25);
            text-align: center;
        }

        .login-card h2 {
            font-size: 18px;
            font-weight: 800;
            color: #ff003c;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: #ff003c;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ff003c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background: #e00035;
        }

        .btn-back {
            display: block;
            margin-top: 14px;
            color: #666;
            text-decoration: none;
            font-size: 12px;
        }

        .btn-back:hover {
            color: #aaa;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🔐 ADMIN ACCESS</h2>
    <div class="input-group">
        <label>รหัสผ่านผู้ดูแลระบบ</label>
        <input type="password" id="passInput" placeholder="กรอกรหัสผ่าน..." onkeyup="handleKey(event)" autofocus>
    </div>
    <button class="btn-submit" onclick="checkPassword()">เข้าสู่ระบบ</button>
    <a href="index.html" class="btn-back">← กลับหน้าหลัก</a>
</div>

<script>
    function handleKey(e) {
        if (e.key === 'Enter') checkPassword();
    }

    function checkPassword() {
        const pass = document.getElementById('passInput').value;
        if (pass === "black.1234") {
            // บันทึกสถานะว่า ล็อกอินแล้ว
            sessionStorage.setItem('isAdmin', 'true');
            // นำทางกลับหน้าหลัก
            window.location.href = 'index.html';
        } else {
            alert("รหัสผ่านไม่ถูกต้อง!");
            document.getElementById('passInput').value = '';
        }
    }
</script>

</body>
</html>
